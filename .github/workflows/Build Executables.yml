name: Build Executables

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            jpackage-type: exe
            extra-args: --win-shortcut --win-menu --win-console --win-dir-chooser
            suffix: windows
          - os: macos-latest
            jpackage-type: dmg
            extra-args: ""
            suffix: mac-applesilicon
          - os: macos-15-intel
            jpackage-type: dmg
            extra-args: ""
            suffix: mac-intel

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Determine app version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build fat jar with Maven
        run: mvn -B package

      - name: Prepare a clean jpackage input folder
        shell: bash
        run: |
          mkdir -p jpackage-input
          cp target/DesktopReportBuilderv2-1.0-SNAPSHOT.jar jpackage-input/

      - name: Package as a native app with jpackage
        shell: bash
        run: |
          jpackage \
            --input jpackage-input \
            --name DesktopReportBuilder \
            --main-jar DesktopReportBuilderv2-1.0-SNAPSHOT.jar \
            --main-class Main \
            --type ${{ matrix.jpackage-type }} \
            --app-version ${{ steps.version.outputs.version }} \
            --dest dist \
            --add-modules java.desktop,java.xml,java.logging,java.naming,java.net.http,java.management,java.security.jgss,java.instrument,jdk.crypto.ec,jdk.crypto.cryptoki,jdk.unsupported,jdk.charsets \
            ${{ matrix.extra-args }}

      - name: Rename installer with a unique platform suffix
        shell: bash
        run: |
          for f in dist/*; do
            ext="${f##*.}"
            base="${f%.*}"
            mv "$f" "${base}-${{ matrix.suffix }}.${ext}"
          done

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: DesktopReportBuilder-${{ matrix.os }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all built installers
        uses: actions/download-artifact@v8
        with:
          path: installers

      - name: Publish GitHub Release with installers attached
        uses: softprops/action-gh-release@v3
        with:
          files: installers/*/*
          generate_release_notes: true
