name: Build Executables

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            jpackage-type: exe
            extra-args: --win-shortcut --win-menu --win-dir-chooser
            suffix: windows
          - os: macos-latest
            jpackage-type: dmg
            extra-args: ""
            suffix: mac-applesilicon
          - os: macos-15-intel
            jpackage-type: dmg
            extra-args: ""
            suffix: mac-intel

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Determine app version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build fat jar with Maven
        run: mvn -B package

      - name: Import signing certificate (macOS only)
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          rm certificate.p12

      - name: List available signing identities (diagnostic, macOS only)
        if: runner.os == 'macOS'
        run: security find-identity -v -p codesigning build.keychain

      - name: Prepare a clean jpackage input folder
        shell: bash
        run: |
          mkdir -p jpackage-input
          cp target/DoctorHelper-1.0-SNAPSHOT.jar jpackage-input/

      - name: Package as a native app with jpackage
        shell: bash
        env:
          MACOS_CERTIFICATE_NAME: ${{ secrets.MACOS_CERTIFICATE_NAME }}
        run: |
          SIGN_ARGS=()
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            SIGN_ARGS=(--mac-sign --mac-signing-key-user-name "$MACOS_CERTIFICATE_NAME" --mac-signing-keychain build.keychain)
          fi

          jpackage \
            --input jpackage-input \
            --name "Doctor Helper" \
            --main-jar DoctorHelper-1.0-SNAPSHOT.jar \
            --main-class Main \
            --type ${{ matrix.jpackage-type }} \
            --app-version ${{ steps.version.outputs.version }} \
            --dest dist \
            --add-modules java.desktop,java.xml,java.logging,java.naming,java.net.http,java.management,java.security.jgss,java.instrument,jdk.crypto.ec,jdk.crypto.cryptoki,jdk.unsupported,jdk.charsets \
            ${{ matrix.extra-args }} \
            "${SIGN_ARGS[@]}"

      - name: Rename installer with a unique platform suffix
        shell: bash
        run: |
          for f in dist/*; do
            ext="${f##*.}"
            base="${f%.*}"
            mv "$f" "${base}-${{ matrix.suffix }}.${ext}"
          done

      - name: Notarize the installer (macOS only)
        if: runner.os == 'macOS'
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_KEY: ${{ secrets.APPSTORE_API_KEY }}
        run: |
          echo "$APPSTORE_API_KEY" | base64 --decode > api_key.p8
          DMG_FILE=$(find dist -name "*.dmg")
          xcrun notarytool submit "$DMG_FILE" \
            --key api_key.p8 \
            --key-id "$APPSTORE_API_KEY_ID" \
            --issuer "$APPSTORE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$DMG_FILE"
          rm api_key.p8

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: DoctorHelper-${{ matrix.os }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all built installers
        uses: actions/download-artifact@v8
        with:
          path: installers

      - name: Publish GitHub Release with installers attached
        uses: softprops/action-gh-release@v3
        with:
          files: installers/*/*
          generate_release_notes: true
