<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuenta Confirmada</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f4f7;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .tarjeta {
            background: white;
            border-radius: 12px;
            padding: 40px;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }
        .icono {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background-color: #00ACC1;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 28px;
        }
        h1 {
            font-size: 20px;
            color: #222;
            margin: 0 0 12px;
        }
        p {
            color: #555;
            line-height: 1.5;
            margin: 0;
        }
    </style>
</head>
<body>
<div class="tarjeta">
    <div class="icono">✓</div>
    <h1>Cuenta confirmada</h1>
    <p>Tu cuenta ha sido verificada correctamente. Puedes cerrar esta pestaña y volver a la aplicación para iniciar sesión.</p>
</div>
</body>
</html>
